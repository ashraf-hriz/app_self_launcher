name: app_self_launcher
description: Launch the host Flutter app and manage Android overlay permission settings.
version: 0.1.0
repository: https://github.com/ashraf-hriz/app_self_launcher
issue_tracker: https://github.com/ashraf-hriz/app_self_launcher/issues
topics:
  - android
  - app-launcher
  - background
  - overlay-permission

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.ashrafhriz.app_self_launcher
        pluginClass: AppSelfLauncherPlugin
